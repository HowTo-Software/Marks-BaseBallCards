name: CodeQL application analysis

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'MarksBaseballCards.slnx'
      - 'dotnet-tools.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'MarksBaseballCards.slnx'
      - 'dotnet-tools.json'
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ csharp, javascript-typescript ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}

      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build src/Api/MarksBaseballCards.Api.csproj -c Release

      - uses: github/codeql-action/analyze@v4
